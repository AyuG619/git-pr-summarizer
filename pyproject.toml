[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "git-pr-summarizer"
version = "1.0.0"
description = "AI-powered CLI that generates PR descriptions from git diffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["git", "cli", "ai", "developer-tools", "llm", "pull-request"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pydantic>=2.0",
    "pyperclip>=1.8",
    "toml>=0.10",
]

[project.scripts]
pr-summarize = "src.cli:app"

[project.urls]
Homepage = "https://github.com/AyuG619/git-pr-summarizer"
Repository = "https://github.com/AyuG619/git-pr-summarizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]